# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Prepare Package

on:
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
        # zip:DEF requires deflate-raw streams (Node >= 20.12); 16.x and 18.x are dropped.

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - run: yarn install --frozen-lockfile
    - run: yarn prepare
    - run: yarn test:coverage
    # The harness is documented as the gate on P0.1, so it has to start from a clean checkout.
    # These two helpers are side-effect free; importing them proves the files are in the repo.
    - name: Harness helper modules are present
      run: node --input-type=module -e "await import('./migration-harness/lib/setup.mjs'); await import('./migration-harness/lib/util.mjs');"
